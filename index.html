<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licitações SP — Urban</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#5f6b7a;--ln:#e3e7ec;--ac:#0b6e4f;--ac2:#e8f4ef;--warn:#b42318;--warnbg:#fdecea;--gold:#9a6700;--goldbg:#fff4d6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--tx:#e6e9ee;--mut:#98a2b3;--ln:#2a3038;--ac:#3ecf8e;--ac2:#13281f;--warn:#ff8a80;--warnbg:#3a1714;--gold:#f5c451;--goldbg:#33290f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:auto}
h1{margin:0;font-size:22px}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
main{max-width:1100px;margin:auto;padding:0 16px 40px}
.tabs{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}
.tab{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600}
.tab[aria-selected=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.tab small{font-weight:400;opacity:.8;margin-left:4px}
.hint{color:var(--mut);font-size:13px;margin:0 0 10px}
.filtros{display:grid;grid-template-columns:2fr 1.2fr 1.2fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.filtros input,.filtros select{width:100%;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.linha2{display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:14px;margin-bottom:12px}
.linha2 label{display:flex;gap:6px;align-items:center;cursor:pointer}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:10px}
.card.prio{border-left:4px solid var(--gold)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.obj{font-weight:600;margin:0 0 6px;overflow-wrap:anywhere}
.val{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.meta{color:var(--mut);font-size:13px;display:flex;gap:6px 14px;flex-wrap:wrap}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--ac2);color:var(--ac);font-weight:600}
.badge.gold{background:var(--goldbg);color:var(--gold)}
.badge.urg{background:var(--warnbg);color:var(--warn)}
.badge.lr{background:var(--ac);color:#fff}
.ramos{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.ramo{font-size:12px;color:var(--mut);border:1px solid var(--ln);border-radius:999px;padding:0 8px}
.acoes{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acoes a{font-size:13px;text-decoration:none;padding:6px 10px;border-radius:8px;border:1px solid var(--ln);color:var(--tx)}
.acoes a.wa{background:#25d366;border-color:#25d366;color:#08331a;font-weight:600}
#mais{display:block;margin:16px auto;padding:10px 18px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--tx);cursor:pointer}
.vazio{color:var(--mut);text-align:center;padding:30px}
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.box{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.box h3{margin:0 0 8px;font-size:14px}
.box ol{margin:0;padding-left:20px;font-size:13px;color:var(--mut)}
.box li span{color:var(--tx);font-weight:600}
.rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabela{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--ln);border-radius:12px;overflow:hidden;font-size:13px}
.tabela th,.tabela td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
.tabela th{color:var(--mut);font-weight:600;background:var(--bg)}
.tabela td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tabela tr.nos td{background:var(--ac2)}
.desc{color:var(--ac);font-weight:600}
.so-editais{}
@media (max-width:760px){.resumo{grid-template-columns:1fr}.tabela .opc{display:none}}
@media (max-width:760px){.filtros{grid-template-columns:1fr 1fr}.filtros .busca{grid-column:1/-1}.top{flex-direction:column;gap:2px}}
</style>
</head>
<body>
<header>
  <h1>Licitações SP</h1>
  <div class="sub" id="sub">Carregando…</div>
</header>
<main>
  <div class="tabs" role="tablist" id="tabs"></div>
  <p class="hint" id="hint"></p>
  <div class="filtros">
    <input class="busca" id="q" type="search" placeholder="Buscar no objeto ou órgão (ex.: EVA, uniforme, pavimentação)">
    <input id="mun" list="muns" placeholder="Município">
    <datalist id="muns"></datalist>
    <select id="ramo"><option value="">Todo ramo</option></select>
    <select id="mod" class="so-editais"><option value="">Toda modalidade</option></select>
    <input id="vmin" class="so-editais" type="number" min="0" step="1000" placeholder="Valor mín. R$">
    <select id="ord" class="so-editais"><option value="prazo">Encerra primeiro</option><option value="valor">Maior valor</option><option value="novo">Mais recente</option></select>
  </div>
  <div class="linha2">
    <label class="so-editais"><input type="checkbox" id="lr"> Só o que a L R pode disputar</label>
    <label class="so-editais"><input type="checkbox" id="prio"> Só cidades prioritárias</label>
    <label class="so-editais"><input type="checkbox" id="srp"> Só registro de preços</label>
    <span id="cont"></span>
  </div>
  <div id="lista"></div>
  <button id="mais" hidden>Mostrar mais</button>
</main>
<script>
const LR_CNPJ="24615728000196";
const TRILHAS={PRODUTOS:{nome:"Produtos",hint:"Fornecimento de material — onde a nossa empresa vende."},
  OBRAS:{nome:"Obras",hint:"Obras e engenharia — repassar para as construtoras parceiras da Liz."},
  SERVICOS:{nome:"Serviços",hint:"Prestação de serviço — fora do foco, só para consulta."},
  PRECOS:{nome:"Preços vencedores",hint:"Quanto ganhou cada item nas cidades prioritárias (últimos 12 meses). Busque o produto para saber o preço que vence."}};
const PAG=60, $=id=>document.getElementById(id);
let D=null, P=null, trilha="PRODUTOS", mostrar=PAG;
const brl=v=>v==null?"—":v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const sem=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const dias=d=>d?Math.ceil((new Date(d)-Date.now())/864e5):null;
const dataBR=d=>d?new Date(d).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
try{const p=new URLSearchParams(location.hash.slice(1));if(TRILHAS[p.get("t")])trilha=p.get("t")}catch(e){}

fetch("data/editais.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{
  D=j; D.editais.forEach(e=>e._b=sem(e.objeto+" "+e.orgao+" "+e.municipio));
  $("sub").textContent=`${D.editais.length.toLocaleString("pt-BR")} editais com proposta aberta no estado de SP · fonte PNCP · atualizado ${new Date(D.atualizado).toLocaleString("pt-BR")} · prioritárias: ${D.prioritarias.join(", ")}`;
  $("muns").innerHTML=[...new Set(D.editais.map(e=>e.municipio))].sort().map(m=>`<option value="${esc(m)}">`).join("");
  $("ramo").innerHTML+= [...new Set(D.editais.flatMap(e=>e.ramos||[]))].sort().map(m=>`<option>${esc(m)}</option>`).join("");
  $("mod").innerHTML+= [...new Set(D.editais.map(e=>e.modalidade))].sort().map(m=>`<option>${esc(m)}</option>`).join("");
  render();
}).catch(()=>{$("sub").textContent="Erro ao carregar data/editais.json"});
fetch("data/precos.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{
  if(!j)return; P=j; P.itens.forEach(i=>i._b=sem(i.desc+" "+i.fornecedor+" "+i.orgao));
  const novos=[...new Set(P.itens.flatMap(i=>i.ramos||[]))].filter(r=>![...$("ramo").options].some(o=>o.value===r));
  $("ramo").innerHTML+=novos.map(m=>`<option>${esc(m)}</option>`).join(""); if(D)render();
}).catch(()=>{});

["q","mun","ramo","mod","vmin","ord","lr","prio","srp"].forEach(id=>$(id).addEventListener("input",()=>{mostrar=PAG;render()}));
$("mais").onclick=()=>{mostrar+=PAG;render()};

function filtrados(t){
  const q=buscaRx(), mun=sem($("mun").value), mod=$("mod").value,
        vmin=+$("vmin").value||0, prio=$("prio").checked, srp=$("srp").checked, lr=$("lr").checked, ramo=$("ramo").value;
  return D.editais.filter(e=>(!t||e.trilha===t)&&q.every(w=>w.test(e._b))&&(!mun||sem(e.municipio).includes(mun))
    &&(!mod||e.modalidade===mod)&&(e.valor||0)>=vmin&&(!prio||e.prioritaria)&&(!lr||(e.ramos||[]).length)&&(!ramo||(e.ramos||[]).includes(ramo))&&(!srp||e.srp)&&(dias(e.encerramento)??1)>=0);
}
function render(){
  $("tabs").innerHTML=Object.entries(TRILHAS).map(([k,v])=>`<button class="tab" role="tab" aria-selected="${k===trilha}" data-t="${k}">${v.nome}<small>${k==="PRECOS"?(P?precosFiltrados().length:"…"):filtrados(k).length}</small></button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{trilha=b.dataset.t;mostrar=PAG;try{location.hash="t="+trilha}catch(e){}render()});
  $("hint").textContent=TRILHAS[trilha].hint;
  document.querySelectorAll(".so-editais").forEach(el=>el.hidden=trilha==="PRECOS");
  if(trilha==="PRECOS")return renderPrecos();
  const ord=$("ord").value, L=filtrados(trilha).sort((a,b)=>
    ord==="valor"?(b.valor||0)-(a.valor||0):ord==="novo"?(b.publicacao||"").localeCompare(a.publicacao||""):(a.encerramento||"9").localeCompare(b.encerramento||"9"));
  const soma=L.reduce((s,e)=>s+(e.valor||0),0);
  $("cont").textContent=`${L.length.toLocaleString("pt-BR")} editais · ${brl(soma)} estimados`;
  $("lista").innerHTML=L.length?L.slice(0,mostrar).map(card).join(""):`<div class="vazio">Nenhum edital com esses filtros.</div>`;
  $("mais").hidden=L.length<=mostrar;
}
function buscaRx(){return sem($("q").value).split(/\s+/).filter(Boolean).map(w=>new RegExp("(^|[^a-z0-9])"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+(w.length<5?"(?![a-z0-9])":"")))}
function precosFiltrados(){
  const q=buscaRx(), mun=sem($("mun").value), ramo=$("ramo").value;
  return P.itens.filter(i=>q.every(w=>w.test(i._b))&&(!mun||sem(i.cidade).includes(mun))&&(!ramo||(i.ramos||[]).includes(ramo)));
}
const unit=v=>v==null?"—":v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:2});
function ranking(lista,chave,valor,n){const m=new Map();lista.forEach(i=>{const k=chave(i);if(k)m.set(k,(m.get(k)||0)+valor(i))});return [...m].sort((a,b)=>b[1]-a[1]).slice(0,n)}
function renderPrecos(){
  if(!P){$("cont").textContent="";$("lista").innerHTML=`<div class="vazio">Histórico de preços ainda em coleta.</div>`;$("mais").hidden=true;return}
  const L=precosFiltrados(), tot=i=>(i.unit||0)*(i.qtd||0);
  $("cont").textContent=`${L.length.toLocaleString("pt-BR")} itens com vencedor · ${brl(L.reduce((s,i)=>s+tot(i),0))} homologados · ${P.compras} compras analisadas`;
  const ramos=ranking(L.flatMap(i=>(i.ramos||[]).map(r=>({r,v:tot(i)}))),x=>x.r,x=>x.v,6);
  const forn=ranking(L,i=>i.fornecedor,tot,6);
  const resumo=`<div class="resumo">
   <div class="box"><h3>O que mais se compra (R$ homologado)</h3><ol>${ramos.map(([k,v])=>`<li><span>${esc(k)}</span> · ${brl(v)}</li>`).join("")||"<li>—</li>"}</ol></div>
   <div class="box"><h3>Quem mais vence (concorrentes)</h3><ol>${forn.map(([k,v])=>`<li><span>${esc(k)}</span> · ${brl(v)}</li>`).join("")||"<li>—</li>"}</ol></div></div>`;
  const linhas=L.slice(0,mostrar).map(i=>{const d=i.est?Math.round((1-i.unit/i.est)*100):null;return `<tr class="${String(i.cnpj||"").replace(/\D/g,"")===LR_CNPJ?"nos":""}">
   <td>${esc(i.desc.slice(0,140))}<div class="meta">${esc(i.cidade)} · ${esc(i.data.split("-").reverse().join("/"))} · <a href="${esc(i.link)}" target="_blank" rel="noopener">edital</a></div></td>
   <td class="num opc">${(i.qtd||0).toLocaleString("pt-BR")} ${esc(i.un||"")}</td>
   <td class="num opc">${unit(i.est)}</td>
   <td class="num"><b>${unit(i.unit)}</b>${d!=null&&d>0?`<div class="desc">−${d}%</div>`:""}</td>
   <td>${esc(i.fornecedor||"")}${i.porte?`<div class="meta">${esc(i.porte)}</div>`:""}</td></tr>`}).join("");
  $("lista").innerHTML=resumo+(L.length?`<div class="rolagem"><table class="tabela"><thead><tr><th>Item</th><th class="opc">Qtd</th><th class="opc">Estimado</th><th>Vencedor (unit.)</th><th>Fornecedor</th></tr></thead><tbody>${linhas}</tbody></table></div>`:`<div class="vazio">Nenhum item com esses filtros.</div>`);
  $("mais").hidden=L.length<=mostrar;
}
function card(e){
  const d=dias(e.encerramento), urg=d!=null&&d<=3;
  const wa=e.trilha==="OBRAS"?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(
    `Oportunidade de obra — ${e.municipio}/SP\n${e.objeto.slice(0,300)}\nÓrgão: ${e.orgao}\nValor estimado: ${brl(e.valor)}\nModalidade: ${e.modalidade}\nPropostas até: ${dataBR(e.encerramento)}\nEdital: ${e.link_pncp}`)}">Enviar p/ parceiro</a>`:"";
  return `<div class="card${e.prioritaria?" prio":""}">
  <div class="top"><p class="obj">${esc(e.objeto.slice(0,320))}${e.objeto.length>320?"…":""}</p><span class="val">${brl(e.valor)}</span></div>
  <div class="meta">
    ${(e.ramos||[]).length?`<span class="badge lr">L R pode disputar</span>`:""}
    <span>${e.prioritaria?`<span class="badge gold">★ ${esc(e.municipio)}</span>`:esc(e.municipio)}</span>
    <span>${esc(e.orgao)}</span><span>${esc(e.modalidade)}${e.srp?" · SRP":""}</span>
    <span class="badge${urg?" urg":""}">encerra ${dataBR(e.encerramento)}${d!=null?` · ${d<=0?"hoje":d+"d"}`:""}</span>
  </div>
  ${(e.ramos||[]).length?`<div class="ramos">${e.ramos.map(r=>`<span class="ramo">${esc(r)}</span>`).join("")}</div>`:""}
  <div class="acoes"><a target="_blank" rel="noopener" href="${esc(e.link_pncp)}">Edital no PNCP</a>${e.link_origem?`<a target="_blank" rel="noopener" href="${esc(e.link_origem)}">Portal de disputa</a>`:""}${wa}</div>
</div>`;
}
</script>
</body>
</html>
