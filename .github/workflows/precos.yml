name: Coletar preços vencedores
on:
  schedule:
    - cron: "30 */4 * * *"   # a cada 4 horas, até o histórico estar completo; depois só completa o que é novo
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  precos:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python precos.py
        env:
          PRECOS_MAX_SEGUNDOS: "2700"   # 45 min; sobra margem para salvar e publicar
          PRECOS_MAX_CHAMADAS: "3000"
      - run: |
          git config user.name "coletor-pncp"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "preços $(date -u +%F-%H%M)"
          git pull --rebase && git push
